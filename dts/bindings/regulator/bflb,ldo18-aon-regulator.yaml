include:
  - name: base.yaml
  - name: regulator.yaml
    property-allowlist:
      - regulator-always-on
      - regulator-boot-on

description: |
  Bouffalolab HBN AON (Always ON section) LDO18 voltage regulator
  It is a LDO with a canonical voltage of 1.80v
  It has two modes, but they are only switched between when going into sleep mode and do not share
  settings areas.

compatible: "bflb,ldo18-aon-regulator"
