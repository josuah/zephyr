title: BouffaloLab DVP (Digital Video Port)

description: |
    The BouffaloLab DVP (Digital Video Port) is a video receiver for parallel camera video sources
    such as image sensors.

    Depending on the SoC, it features:

    - Input from a single DVP camera source per system
    - Pixel format conversion during reception
    - Several YUV and RGB input and output formats (availability depending on SoC)
    - Configurable frame dropping
    - Frame cropping/subsampling at reception time
    - Different HSYNC/VSYNC polarities
    - Optionally, buffer overwritten every frame

    Data is fed from the parallel signal of the camera, converted by a pixel processing engine,
    and fed into one of these AXI masters.

compatible: "bflb,dvp"

include: [base.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

child-binding:
  child-binding:
    include: video-interfaces.yaml

examples:
  - |
    &dvp {
      status = "okay";

      port {
        dvp_ep_in: endpoint {
          remote-endpoint-label = "ov2640_ep_out";
        };
      };
    };
